<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Lumen: a cinematic UI for Jellyfin">
  <defs>
    <radialGradient id="lpGlowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e12d39" stop-opacity=".28"/>
      <stop offset="1" stop-color="#e12d39" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lpCardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a1a20"/><stop offset="1" stop-color="#1a1214"/>
    </linearGradient>
    <linearGradient id="lpCardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2c32"/><stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="lpCardC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a1f29"/><stop offset="1" stop-color="#1b1012"/>
    </linearGradient>
    <linearGradient id="lpFadeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="lpFade" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720">
      <rect width="1280" height="720" fill="url(#lpFadeG)"/>
    </mask>
    <linearGradient id="lpVignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/>
      <stop offset=".25" stop-color="#000" stop-opacity="0"/>
      <stop offset=".75" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="lpLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e12d39"/><stop offset=".3" stop-color="#e12d39"/><stop offset="1" stop-color="#e12d39" stop-opacity="0"/>
    </linearGradient>
    <filter id="lpBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>

    <!-- Lumen J mark (from client/src/assets/lumen-j.svg), ids prefixed lp -->
    <linearGradient id="lpJBack" x1="46" y1="3" x2="46" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c30a14"/><stop offset=".6" stop-color="#a5070f"/><stop offset="1" stop-color="#82050b"/>
    </linearGradient>
    <linearGradient id="lpJShade" x1="45.2" y1="34.6" x2="49.6" y2="25.8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000" stop-opacity=".62"/><stop offset=".22" stop-color="#000" stop-opacity=".3"/><stop offset=".6" stop-color="#000" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lpJFront" x1="50" y1="32" x2="14" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3121e"/><stop offset=".55" stop-color="#e00a16"/><stop offset="1" stop-color="#b80711"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#0b0b0b"/>

  <!-- ambient glows -->
  <ellipse cx="1060" cy="250" rx="420" ry="300" fill="url(#lpGlowB)"/>

  <!-- abstract tilted poster-card rows, fading toward the left -->
  <g mask="url(#lpFade)" filter="url(#lpBlur)" opacity=".9">
    <g transform="translate(760 360) rotate(-14) skewX(-8)">
      <g transform="translate(-100 -330)">
        <rect x="0"   y="0" width="270" height="152" rx="14" fill="url(#lpCardB)"/>
        <rect x="290" y="0" width="270" height="152" rx="14" fill="url(#lpCardA)"/>
        <rect x="580" y="0" width="270" height="152" rx="14" fill="url(#lpCardB)"/>
        <rect x="870" y="0" width="270" height="152" rx="14" fill="url(#lpCardC)"/>
      </g>
      <g transform="translate(-230 -150)">
        <rect x="0"   y="0" width="270" height="152" rx="14" fill="url(#lpCardA)"/>
        <rect x="290" y="0" width="270" height="152" rx="14" fill="url(#lpCardC)"/>
        <rect x="580" y="0" width="270" height="152" rx="14" fill="url(#lpCardB)"/>
        <rect x="870" y="0" width="270" height="152" rx="14" fill="url(#lpCardA)"/>
      </g>
      <g transform="translate(-60 30)">
        <rect x="0"   y="0" width="270" height="152" rx="14" fill="url(#lpCardB)"/>
        <rect x="290" y="0" width="270" height="152" rx="14" fill="url(#lpCardA)"/>
        <rect x="580" y="0" width="270" height="152" rx="14" fill="url(#lpCardC)"/>
        <rect x="870" y="0" width="270" height="152" rx="14" fill="url(#lpCardB)"/>
      </g>
      <g transform="translate(-200 210)">
        <rect x="0"   y="0" width="270" height="152" rx="14" fill="url(#lpCardC)"/>
        <rect x="290" y="0" width="270" height="152" rx="14" fill="url(#lpCardB)"/>
        <rect x="580" y="0" width="270" height="152" rx="14" fill="url(#lpCardA)"/>
        <rect x="870" y="0" width="270" height="152" rx="14" fill="url(#lpCardB)"/>
      </g>
    </g>
  </g>

  <rect width="1280" height="720" fill="url(#lpVignette)"/>

  <!-- mark -->
  <g transform="translate(66 164) scale(5.6)">
    <path fill="url(#lpJBack)" d="M39 3.6Q46 2.6 53 3.6V41H39Z"/>
    <path fill="url(#lpJShade)" d="M39 31l14 7V20L39 13Z"/>
    <path fill="url(#lpJFront)" d="M39 31l14 7v3a21 21 0 0 1-42 0v-6.4Q18 33.6 25 34.6V41a7 7 0 0 0 14 0Z"/>
  </g>

  <!-- wordmark -->
  <text x="436" y="410" font-family="Inter, -apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="206" font-weight="800" letter-spacing="-9" fill="#f2f2f2">Lumen</text>
  <rect x="444" y="448" width="420" height="7" rx="3.5" fill="url(#lpLine)"/>
  <text x="442" y="522" font-family="Inter, -apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="500" letter-spacing="-0.5" fill="#8c8c8c">A cinematic UI for Jellyfin</text>
</svg>
