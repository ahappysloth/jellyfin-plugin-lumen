name: E2E
on:
  workflow_call:
    inputs:
      jellyfin-image:
        type: string
        required: true
      report-name:
        type: string
        default: e2e-report
      # Pull requests run every spec on chromium and the `@smoke` ones on firefox and webkit-iphone, in parallel jobs
      # that take no longer than a chromium one. The nightly run sets this to run every spec on all three.
      all-browsers:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.project }}${{ matrix.part && format(' {0}/2', matrix.part) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The Playwright projects in e2e/playwright.config.ts, and the browser each one installs. Chromium runs every
        # spec, so it's split in two jobs of about 5 minutes each (`part`, LUMEN_E2E_PART in the config).
        include:
          - project: chromium
            browser: chromium
            part: 1
          - project: chromium
            browser: chromium
            part: 2
          - project: firefox
            browser: firefox
          - project: webkit-iphone
            browser: webkit
    steps:
      - uses: actions/checkout@v7
      # Docker shares one download between this and `docker run` below, which then waits for it.
      - name: Pull Jellyfin in the background
        run: (docker pull -q "${{ inputs.jellyfin-image }}" >/dev/null 2>&1 &)
      - uses: actions/download-artifact@v8
        with:
          name: plugin
          path: plugin
      # The fixtures only change with the script that makes them: a hit skips installing ffmpeg and encoding (~30 s).
      # The runner image too: it brings ffmpeg and the fonts the artwork is drawn with.
      - id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: media
        uses: actions/cache@v6
        with:
          path: media
          key: e2e-media-${{ steps.image.outputs.version }}-${{ hashFiles('scripts/gen-test-media.sh', 'scripts/env.sh') }}
      - name: Generate fixture media
        if: steps.media.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          FFMPEG=ffmpeg ./scripts/gen-test-media.sh "$PWD/media"
      - name: Start Jellyfin with Lumen installed
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          mkdir -p "config/plugins/Lumen_$VERSION" cache
          cp plugin/Jellyfin.Plugin.Lumen.dll "config/plugins/Lumen_$VERSION/"
          # The stub Seerr (started by Playwright on this runner) is reached via host.docker.internal.
          docker run -d --name jellyfin -p 8096:8096 \
            --add-host=host.docker.internal:host-gateway \
            -e LUMEN_TMDB_IMAGE_BASE=http://host.docker.internal:5055/t/p \
            -v "$PWD/config:/config" -v "$PWD/cache:/cache" -v "$PWD/media:/media:ro" \
            "${{ inputs.jellyfin-image }}"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # node_modules and this job's Playwright browser, keyed by the lockfile (which pins the Playwright version).
      - id: e2e-deps
        uses: actions/cache@v6
        with:
          path: |
            e2e/node_modules
            ~/.cache/ms-playwright
          key: e2e-deps-${{ runner.os }}-node24-${{ matrix.browser }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install the e2e dependencies and browser
        if: steps.e2e-deps.outputs.cache-hit != 'true'
        working-directory: e2e
        run: |
          npm ci
          npx playwright install ${{ matrix.browser }}
      # The browser's system libraries aren't in the cache (for WebKit, these include GStreamer's codecs).
      - name: Install the browser's system dependencies
        working-directory: e2e
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Run the e2e suite
        working-directory: e2e
        run: npx playwright test --project=${{ matrix.project }} ${{ (!inputs.all-browsers && matrix.project != 'chromium') && '--grep=@smoke' || '' }}
        env:
          CI: 'true'
          LUMEN_E2E_BASE_URL: http://localhost:8096
          LUMEN_E2E_MEDIA_PATH: /media
          LUMEN_E2E_SEERR_URL: http://host.docker.internal:5055
          LUMEN_E2E_PART: ${{ matrix.part }}
      # The whole suite runs on chromium, half in each part; the other browsers may run only the smoke specs. Part 1
      # records the version, so its note stands only when the whole run passed.
      - name: Record the Jellyfin version the suite passed on
        if: matrix.project == 'chromium' && matrix.part == 1
        run: |
          VERSION="$(curl -fsS http://localhost:8096/System/Info/Public | jq -r .Version)"
          RELEASE="$(cut -d. -f1,2 <<<"$VERSION")"
          echo "E2E chromium part 1 passed on Jellyfin $VERSION (\`${{ inputs.jellyfin-image }}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "$VERSION ${{ inputs.jellyfin-image }} $(date -u +%Y-%m-%dT%H:%M:%SZ)" > tested-jellyfin.txt
          # Diagnostics flag servers on releases missing from this list as "untested" (client/src/compat/testedVersions.ts).
          if ! jq -e --arg r "$RELEASE" '.versions | index($r)' client/src/compat/tested-jellyfin.json >/dev/null; then
            echo "::warning title=Untested Jellyfin release passed::E2E chromium part 1 passed on Jellyfin $VERSION. If the run passed, add \"$RELEASE\" to client/src/compat/tested-jellyfin.json."
          fi
      - if: matrix.project == 'chromium' && matrix.part == 1
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.report-name }}-jellyfin-version-${{ github.run_attempt }}
          path: tested-jellyfin.txt
      - if: failure()
        run: docker logs jellyfin > jellyfin.log 2>&1 || true
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.report-name }}-${{ matrix.project }}${{ matrix.part && format('-{0}', matrix.part) || '' }}-${{ github.run_attempt }}
          path: |
            e2e/playwright-report
            e2e/test-results
            jellyfin.log
