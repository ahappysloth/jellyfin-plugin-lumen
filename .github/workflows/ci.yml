name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the e2e suite has anything to check (scripts/ci-plan.sh): not for docs-only changes or release version
  # bumps, nor for a push to main that a pull request already ran it on, unchanged.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          plan=$(scripts/ci-plan.sh)
          echo "$plan" | tee -a "$GITHUB_OUTPUT"
          echo "E2E $(echo "$plan" | sed -n 's/^e2e=//p'): $(echo "$plan" | sed -n 's/^reason=//p')" >> "$GITHUB_STEP_SUMMARY"

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # node_modules itself, keyed by the lockfile: a hit skips npm ci (~40 s).
      - id: deps
        uses: actions/cache@v6
        with:
          path: client/node_modules
          key: client-node-modules-${{ runner.os }}-node24-${{ hashFiles('client/package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: npm run compat
      - uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client/dist

  server:
    needs: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
      - uses: actions/download-artifact@v8
        with:
          name: client-dist
          path: client/dist
      - run: dotnet test --nologo -p:SkipClientBuild=true
      - run: dotnet publish src/Jellyfin.Plugin.Lumen -c Release -o artifacts/plugin --nologo -p:SkipClientBuild=true
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: artifacts/plugin/Jellyfin.Plugin.Lumen.dll

  e2e:
    needs: [plan, server]
    if: needs.plan.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      jellyfin-image: jellyfin/jellyfin:12.4
