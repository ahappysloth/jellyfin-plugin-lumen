name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client/dist

  server:
    needs: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v8
        with:
          name: client-dist
          path: client/dist
      - run: dotnet test --nologo -p:SkipClientBuild=true
      - run: dotnet publish src/Jellyfin.Plugin.Lumen -c Release -o artifacts/plugin --nologo -p:SkipClientBuild=true
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: artifacts/plugin/Jellyfin.Plugin.Lumen.dll

  e2e:
    needs: server
    uses: ./.github/workflows/e2e.yml
    with:
      jellyfin-image: jellyfin/jellyfin:12.4
