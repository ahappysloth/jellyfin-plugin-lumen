name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist

  server:
    needs: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v7
        with:
          name: client-dist
          path: client/dist
      - run: dotnet test --nologo -p:SkipClientBuild=true
      - run: dotnet publish src/Jellyfin.Plugin.Lumen -c Release -o artifacts/plugin --nologo -p:SkipClientBuild=true
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: artifacts/plugin/Jellyfin.Plugin.Lumen.dll

  e2e:
    needs: server
    uses: ./.github/workflows/e2e.yml
    with:
      jellyfin-image: jellyfin/jellyfin:12.2
