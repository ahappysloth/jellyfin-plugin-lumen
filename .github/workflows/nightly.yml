name: Nightly compatibility
on:
  # Weekly, on Mondays: every spec on every browser costs runner minutes, and the releases it checks change slowly.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/Jellyfin.Plugin.Lumen -c Release -o artifacts/plugin --nologo
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: artifacts/plugin/Jellyfin.Plugin.Lumen.dll

  e2e:
    name: e2e (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # `name` labels the reports (artifact names can't contain ':' or '/'). Every spec on all three browsers against the
        # oldest release Lumen supports and the newest; `unstable` (the next release) on Chromium only. 12.4 is what
        # every pull request runs on, and `latest` while it's the newest release.
        include:
          # The oldest release Lumen supports: its targetAbi is 12.1, and jellyfin-web 12.1 differs from 12.4.
          - image: jellyfin/jellyfin:12.1
            name: '12.1'
          - image: jellyfin/jellyfin:latest
            name: latest
          - image: jellyfin/jellyfin:unstable
            name: unstable
            chromium-only: true
    uses: ./.github/workflows/e2e.yml
    with:
      jellyfin-image: ${{ matrix.image }}
      report-name: e2e-report-jellyfin-${{ matrix.name }}
      all-browsers: true
      chromium-only: ${{ matrix.chromium-only || false }}
