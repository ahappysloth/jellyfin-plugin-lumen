name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read # to check CI passed on the tagged commit

# Every step is safe to re-run: the release and the manifest entry are created or reused, never duplicated.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate the tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_REF_NAME" origin/main || { echo "Tag '$GITHUB_REF_NAME' is not on main"; exit 1; }
      - name: Require CI to have passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CI (ci.yml, including E2E) runs on every push to main. Wait for it if the tag was pushed right after the commit.
          SHA="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          for attempt in $(seq 1 60); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --event push --json status,conclusion)"
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then echo "CI passed on $SHA"; exit 0; fi
            # A tag pushed right after the merge can beat CI's run onto the commit: give it a few minutes to appear.
            if [ "$attempt" -le 10 ] && jq -e 'length == 0' <<<"$runs" >/dev/null; then
              echo "No CI run on $SHA yet; waiting ($attempt/10)"; sleep 30; continue
            fi
            if ! jq -e 'any(.[]; .status != "completed")' <<<"$runs" >/dev/null; then
              echo "No successful CI run on $SHA (runs: $runs). Push the commit to main and let CI pass, then re-run this job."
              exit 1
            fi
            echo "CI is still running on $SHA; waiting ($attempt/60)"
            sleep 30
          done
          echo "Timed out waiting for CI on $SHA"; exit 1
      - name: Compute version
        id: v
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "semver=$TAG" >> "$GITHUB_OUTPUT"
          echo "jellyfin=$TAG.0" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          git checkout "$GITHUB_REF_NAME"
          (cd client && npm ci && npm run lint && npm run typecheck && npm test && npm run build && npm run size)
          dotnet test --nologo -p:SkipClientBuild=true
          node --test scripts/update-manifest.test.mjs
          dotnet publish src/Jellyfin.Plugin.Lumen -c Release -o artifacts/plugin --nologo -p:SkipClientBuild=true \
            -p:Version=${{ steps.v.outputs.jellyfin }} -p:AssemblyVersion=${{ steps.v.outputs.jellyfin }} -p:FileVersion=${{ steps.v.outputs.jellyfin }}
          (cd artifacts/plugin && zip -j "../lumen_${{ steps.v.outputs.jellyfin }}.zip" Jellyfin.Plugin.Lumen.dll)
      - name: Extract changelog section
        run: |
          awk "/^## \\[${{ steps.v.outputs.semver }}\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for ${{ steps.v.outputs.semver }}"; exit 1; }
      - name: Create (or reuse) the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: lumen_${{ steps.v.outputs.jellyfin }}.zip
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run: keep the zip users may already have downloaded (the manifest checksum must match it).
            if gh release download "$GITHUB_REF_NAME" --pattern "$ZIP" --dir artifacts --clobber; then
              echo "Release $GITHUB_REF_NAME exists; using its $ZIP"
            else
              gh release upload "$GITHUB_REF_NAME" "artifacts/$ZIP"
            fi
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "artifacts/$ZIP" --title "Lumen ${{ steps.v.outputs.semver }}" --notes-file release-notes.md
          fi
      - name: Publish to the plugin repository manifest
        env:
          ZIP: lumen_${{ steps.v.outputs.jellyfin }}.zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebuild the commit on the newest main each time, so a push race (or a re-run) never loses anyone's work.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B publish-manifest origin/main
            node scripts/update-manifest.mjs --version "${{ steps.v.outputs.jellyfin }}" \
              --zip "artifacts/$ZIP" \
              --url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$ZIP" \
              --changelog "$(cat release-notes.md)"
            if git diff --quiet -- manifest.json; then echo "manifest.json already lists ${{ steps.v.outputs.semver }}"; exit 0; fi
            git commit -m "chore(release): publish ${{ steps.v.outputs.semver }} to manifest" -- manifest.json
            if git push origin HEAD:main; then exit 0; fi
            echo "Push failed (attempt $attempt); retrying on the new main"
            sleep $((attempt * 5))
          done
          echo "Could not push manifest.json; re-run this job"; exit 1
